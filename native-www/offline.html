<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Animivo — connection</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #faf7f2;
        color: #2c2a26;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      }
      .card { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #6b6560; line-height: 1.45; }
      button {
        margin-top: 1rem;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 999px;
        background: #6b8f71;
        color: #fff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Animivo</h1>
      <p>Animivo can't reach the care service right now. Check your connection and try again.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
